name: Verify Chess Prodigy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan committed source for secrets
        shell: bash
        run: |
          set -euo pipefail
          scan_dir=$(mktemp -d)
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$scan_dir/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o "$scan_dir/checksums.txt"
          (cd "$scan_dir" && grep ' gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sha256sum --check)
          tar -xzf "$scan_dir/gitleaks_8.30.1_linux_x64.tar.gz" -C "$scan_dir"
          "$scan_dir/gitleaks" git --redact --no-banner .
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report
            test-results
            docs/verification/*png
